name: Release desktop artifacts

on:
  workflow_run:
    workflows:
      - Electron desktop build
    types:
      - completed
    branches:
      - "**"

concurrency:
  group: release-desktop-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 18

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Verify release gates and checksums
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prove fast gates
        run: chmod +x tests/run-fast.sh && chmod +x tests/harness/run-all.sh && bash tests/run-fast.sh

      - name: Verify SHA256SUMS is current
        run: |
          node tests/update-checksums.js
          git diff --exit-code -- SHA256SUMS

  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build ${{ matrix.name }} desktop artifact
    needs: verify
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runs_on: windows-latest
            package_command: npm run package:win
            artifact_name: release-electron-windows
          - name: Linux
            runs_on: ubuntu-latest
            package_command: npm run package:linux
            artifact_name: release-electron-linux
          - name: macOS
            runs_on: macos-latest
            package_command: npm run package:mac
            artifact_name: release-electron-macos
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Run Electron smoke test
        run: xvfb-run -a npm run test:smoke
        if: ${{ matrix.runs_on == 'ubuntu-latest' }}

      - name: Run Electron smoke test
        run: npm run test:smoke
        if: ${{ matrix.runs_on != 'ubuntu-latest' }}

      - name: Build desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.package_command }}

      - name: Archive portable desktop app
        shell: bash
        run: |
          mkdir -p release-assets

          case "${{ runner.os }}" in
            Windows)
              if [ ! -d dist/win-unpacked ]; then
                echo "Expected unpacked Windows app directory dist/win-unpacked was not produced." >&2
                exit 1
              fi

              if ! find dist/win-unpacked -maxdepth 1 -type f -name '*.exe' | grep -q .; then
                echo "Expected at least one runnable .exe inside dist/win-unpacked before archiving." >&2
                exit 1
              fi

              archive_name="SpeXex-${{ github.event.workflow_run.head_sha }}-windows-x64.zip"
              archive_path="release-assets/$archive_name"
              powershell -NoLogo -NoProfile -Command "Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath '$archive_path' -Force"
              ;;
            Linux)
              if [ ! -d dist/linux-unpacked ]; then
                echo "Expected unpacked Linux app directory dist/linux-unpacked was not produced." >&2
                exit 1
              fi

              if ! find dist/linux-unpacked -maxdepth 1 -type f \( -perm -111 -o -name 'SpeXex' -o -name '*.AppImage' \) | grep -q .; then
                echo "Expected a runnable Linux entrypoint inside dist/linux-unpacked before archiving." >&2
                exit 1
              fi

              archive_name="SpeXex-${{ github.event.workflow_run.head_sha }}-linux-x64.tar.gz"
              archive_path="release-assets/$archive_name"
              tar -C dist -czf "$archive_path" linux-unpacked
              ;;
            macOS)
              if [ ! -d dist/mac ]; then
                echo "Expected unpacked macOS app directory dist/mac was not produced." >&2
                exit 1
              fi

              if ! find dist/mac -maxdepth 1 -type d -name '*.app' | grep -q .; then
                echo "Expected at least one runnable .app bundle inside dist/mac before archiving." >&2
                exit 1
              fi

              archive_name="SpeXex-${{ github.event.workflow_run.head_sha }}-macos-${{ runner.arch }}.zip"
              archive_path="release-assets/$archive_name"
              ditto -c -k --sequesterRsrc --keepParent dist/mac "$archive_path"
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac

          printf '%s\n' "$archive_path"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            electron/release-assets/*.zip
            electron/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish desktop release
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: desktop-${{ github.event.workflow_run.head_sha }}
      RELEASE_TARGET: ${{ github.event.workflow_run.head_sha }}
      RELEASE_DRAFT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release flags
        id: release_flags
        shell: bash
        run: |
          prerelease_flag=""
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc) ]]; then
            prerelease_flag="--prerelease"
          fi

          draft_flag=""
          if [ "$RELEASE_DRAFT" = "true" ]; then
            draft_flag="--draft"
          fi

          echo "prerelease_flag=$prerelease_flag" >> "$GITHUB_OUTPUT"
          echo "draft_flag=$draft_flag" >> "$GITHUB_OUTPUT"

      - name: Collect release asset files
        shell: bash
        run: |
          mkdir -p release-bundle

          find \
            release-artifacts/release-electron-windows \
            release-artifacts/release-electron-linux \
            release-artifacts/release-electron-macos \
            -maxdepth 1 -type f \
            \( \
              -name '*.zip' -o \
              -name '*.tar.gz' \
            \) \
            | sort > release-assets.txt

          if [ ! -s release-assets.txt ]; then
            echo "No archive-only desktop release files were found for release upload." >&2
            exit 1
          fi

          while IFS= read -r asset_path; do
            cp "$asset_path" release-bundle/
          done < release-assets.txt

          (
            cd release-bundle
            sha256sum *.zip *.tar.gz > SHA256SUMS
          )

          find release-bundle -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name 'SHA256SUMS' \) \
            | sort > release-upload-files.txt

          cat release-upload-files.txt

      - name: Create or update GitHub release
        shell: bash
        run: |
          mapfile -t asset_files < release-upload-files.txt

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest=false \
              ${{ steps.release_flags.outputs.draft_flag }} \
              ${{ steps.release_flags.outputs.prerelease_flag }}
          fi

          gh release upload "$RELEASE_TAG" "${asset_files[@]}" --clobber
