name: Wallet proof harness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      doge_refund_repeats:
        description: DOGE refund repeat count for settlement stress coverage (1-20)
        required: false
        default: "3"

concurrency:
  group: proof-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 18

jobs:
  fast-gates:
    name: Fast contracts and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run deterministic release gates
        run: chmod +x tests/run-fast.sh && chmod +x tests/harness/run-all.sh && bash tests/run-fast.sh

  browser-settlement:
    name: Chromium and settlement matrix
    needs: fast-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/harness/package-lock.json

      # Cache Playwright browser artifacts at the same default path used by the
      # harness runtime. Do not redirect PLAYWRIGHT_BROWSERS_PATH only during
      # install, because the tests later launch from ~/.cache/ms-playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('tests/harness/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-browsers-

      - name: Install pinned harness dependencies
        working-directory: tests/harness
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: tests/harness
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxss1 \
            libasound2 \
            libgbm1 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            fonts-liberation \
            libdbus-1-3 || true
          # install only Chromium; --with-deps tries to install deps itself, but
          # we call apt-get above to be robust on CI
          npx playwright install --with-deps chromium

      - name: Run browser and independently validated settlement gates
        env:
          SKIP_MUTATIONS: "1"
          CI: "true"
          DOGE_ROD_REFUND_REPEATS: ${{ github.event.inputs.doge_refund_repeats || '3' }}
        run:  chmod +x tests/harness/run-all.sh && bash tests/harness/run-all.sh

      - name: Upload scenario reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: settlement-proof-reports
          path: tests/harness/e2e-report-*.json
          if-no-files-found: warn
          retention-days: 30
